services:
  postgres:
    image: postgres:16-alpine
    container_name: heisenbug_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: heisenbug
      POSTGRES_PASSWORD: heisenbug_secret
      POSTGRES_DB: heisenbug
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heisenbug -d heisenbug"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
